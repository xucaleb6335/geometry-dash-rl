name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests (learn stubs report as skipped)
        run: pytest -rs

  bridge-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Geode-free bridge server with warnings as errors
        run: |
          cmake -S mod/tools -B build/tools -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build/tools

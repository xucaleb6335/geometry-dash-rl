[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrl"
version = "0.1.0"
description = "Reinforcement learning agent for Geometry Dash, via a Geode mod and PyTorch."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=2,<3",
    "gymnasium==1.3.0",
    "pyyaml>=6",
    # Install torch first with the CUDA index URL (see README); this line only
    # checks the version so pip does not swap your CUDA build for a CPU one.
    "torch>=2.14,<2.15",
    "tensorboard>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gdrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow'"
markers = ["slow: long training runs, e.g. the CartPole gate (run with -m slow)"]
